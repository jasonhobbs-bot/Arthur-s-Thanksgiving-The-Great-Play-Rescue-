.color-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,288px);gap:17px;align-items:start}.color-paper-wrap{background:#fff;border:5px solid #8a5667;border-radius:24px;box-shadow:var(--shadow);padding:10px}.color-paper{display:block;width:100%;height:auto;background:white;border-radius:14px;touch-action:manipulation;aspect-ratio:900/620;box-shadow:inset 0 0 0 2px #fff}.color-paper [data-part]{cursor:pointer;transition:filter .15s}.color-paper [data-part]:hover{filter:brightness(.93)}.color-sidebar{border:4px solid #99677b;background:#fff8ed;border-radius:24px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}.color-tabs{display:flex;gap:8px;flex-wrap:wrap}.color-tabs button{flex:1;min-width:66px;min-height:50px;background:#fff;border:3px solid #a97980;border-radius:14px;font-weight:900;font-size:24px}.color-tabs button.active{background:#ffe79b;border-color:#824861}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.crayon{border:3px solid #ffffff;outline:2px solid #917687;width:100%;aspect-ratio:1/1;min-width:0;min-height:37px;border-radius:12px;box-shadow:0 3px 0 #0002}.crayon.chosen{outline:4px solid #48283f;transform:scale(1.08)}.color-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color-tools button{min-height:46px;font-weight:950;font-size:14px;background:#fff;border:2px solid #966b79;border-radius:13px}.color-tools .wide{grid-column:span 2;background:#ffdf9e}.stickers{display:flex;gap:7px;flex-wrap:wrap}.sticker{font-size:29px;background:#fff;border:2px solid #aa7b8c;border-radius:11px;padding:5px 9px;min-width:44px;min-height:43px}.sticker.selected{background:#fee49d;border-color:#624159}.color-help{font-weight:850;color:#765566;line-height:1.35;font-size:14px;margin:0}.color-progress{font-weight:1000;background:#fff4ce;padding:9px;border-radius:13px;border:2px solid #e7c68a}.color-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px auto;justify-content:center}.color-actions button{padding:9px 12px;font-size:14px}.color-footer{text-align:center;font-size:14px;font-weight:800;color:#765363;margin-top:12px}

/* Three genuinely different age pathways */
.quest.kpattern,.quest.kmemory,.quest.kcostume,.quest.korder{background:#fff3d7}
.quest.onemaze,.quest.onedash,.quest.onelights,.quest.onecues{background:#e9edff}
.game-copy{font-weight:900;color:#704e66;text-align:center;font-size:clamp(17px,2.2vw,23px);line-height:1.4;padding:10px}
.game-note{padding:10px;background:#ffefbf;border:2px solid #dbb88b;border-radius:15px;font-weight:900;text-align:center;margin:12px auto}
.puzzle-pill{background:#fff;border:3px solid #a27686;border-radius:20px;padding:14px 20px;min-height:65px;font-size:clamp(26px,4.5vw,42px);font-weight:900;color:#67425c;box-shadow:0 5px 0 #8f627766;touch-action:manipulation}
.pattern-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:25px 10px;background:#fae9cc;border-radius:25px;border:3px dashed #b37e80;min-height:130px}
.pattern-row .puzzle-pill{min-width:66px;min-height:75px;background:#fffaf1;display:grid;place-items:center}
.pattern-row .unknown{background:#f7b7dc;color:#714760;animation:blink 1.5s ease-in-out infinite}
.puzzle-options{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:25px auto}
.puzzle-options button{min-width:80px;font-size:45px}
.memory-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:690px;margin:20px auto}
.memory-card{min-height:95px;aspect-ratio:1/1;border:4px solid #8a5474;border-radius:20px;background:linear-gradient(135deg,#dca3d0,#9c62ba);color:white;font-size:clamp(31px,5vw,56px);box-shadow:0 6px 0 #773d69;display:grid;place-items:center}
.memory-card.up{background:#fff8e8;color:#573c52}.memory-card.matched{background:#c6edd0;border-color:#448977;opacity:.85}
.workshop{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px auto;max-width:800px}
.work-panel{background:#fff7e9;border:4px solid #ac8290;border-radius:25px;padding:16px;text-align:center}.work-panel h3{margin:4px 0 16px}
.work-list{display:flex;gap:13px;flex-wrap:wrap;justify-content:center}.work-piece,.work-target{width:clamp(72px,9vw,106px);height:clamp(72px,9vw,106px);font-size:clamp(35px,5vw,56px);border-radius:22px;border:4px solid #996783;background:white;box-shadow:0 5px 0 #633f5670}

<body><div id="app">
<header><div class="brand"><strong>🦃 Arthur's Thanksgiving</strong><small id="gradeLabel">Choose your grade to start!</small></div><div class="btns"><nav class="grade-switch" aria-label="Switch grade level instantly"><button type="button" class="grade-tab" data-grade-switch="pk" aria-pressed="false" aria-label="Switch to Pre-K">🐣 Pre-K</button><button type="button" class="grade-tab" data-grade-switch="k" aria-pressed="false" aria-label="Switch to Kindergarten">🧩 K</button><button type="button" class="grade-tab" data-grade-switch="one" aria-pressed="false" aria-label="Switch to First Grade">⭐ 1st</button></nav><button class="tiny" id="homeBtn" aria-label="Go to main menu">⌂ Home</button><button class="tiny" id="audioBtn" aria-label="Toggle sound">🔊 Sound</button></div></header>
<main id="screen" class="screen" aria-live="polite"></main><div id="toast" class="toast hidden" role="status"></div>
</div>
<script>
(()=>{'use strict';
const S=document.getElementById('screen'),toastEl=document.getElementById('toast'),gradeLabel=document.getElementById('gradeLabel');
const GRADES={pk:{label:'Pre-K',emoji:'🐣',desc:'Coloring, easy turkey hunt, dance, and playful surprises',huntTargets:3,huntDistractors:3,beats:[2,2,3,3],catchTimes:[27,30,30],catchSpeed:90,catchGoal:[5,6,7],stageSlots:2,colorGoal:16},k:{label:'Kindergarten',emoji:'🧩',desc:'Memory quests, patterns, sorting machine, and costume workshop',huntTargets:4,huntDistractors:4,beats:[3,3,4,4],catchTimes:[30,32,32],catchSpeed:119,catchGoal:[7,8,9],stageSlots:3,colorGoal:28},one:{label:'First Grade',emoji:'⭐',desc:'A full six-chapter Arthur arcade, prop races, lights, and stage puzzles',huntTargets:5,huntDistractors:5,beats:[4,4,5,6],catchTimes:[32,35,37],catchSpeed:150,catchGoal:[10,11,12],stageSlots:4,colorGoal:40}};
const QUESTS={story:{emoji:'📖',name:'The Big Problem',description:'Hear how Arthur’s Thanksgiving play begins.'},hunt:{emoji:'🔎',name:'The Turkey Hunt',description:'Explore backstage to recover the missing props.'},color:{emoji:'🎨',name:'Coloring Studio',description:'Ten detailed coloring scenes, stickers, and art challenges.'},rhythm:{emoji:'🥁',name:'Rehearsal Dance',description:'Watch, remember, and tap the dance steps.'},catch:{emoji:'🧺',name:'Prop Catch!',description:'Slide the basket to catch falling decorations.'},finale:{emoji:'🎭',name:'The Big Show',description:'Put the play together and watch the finale.'}};
const GRADE_QUESTS={
  pk:QUESTS,
  k:{story:QUESTS.story,color:QUESTS.color,kpattern:{emoji:'🍂',name:'Leaf Pattern Parade',description:'Figure out the missing part of a growing pattern.'},kmemory:{emoji:'🃏',name:'Backstage Memory',description:'Flip cards and find matching Thanksgiving pairs.'},kcostume:{emoji:'🪶',name:'Turkey Costume Workshop',description:'Choose pieces and put them in matching costume slots.'},korder:{emoji:'🎬',name:'Get the Play Ready',description:'Put school-play events in the right order.'},ksort:{emoji:'📦',name:'Backstage Sorting Machine',description:'Run the stage sorter: costumes or decorations?'},finale:QUESTS.finale},
  one:{story:QUESTS.story,onearcade:{emoji:'🎮',name:'Arthur’s Backstage Rescue',description:'Six arcade chapters. Move Arthur, find scripts, dodge props, open the curtain!'},color:QUESTS.color,onemaze:{emoji:'🗺️',name:'Script Quest Maze',description:'Explore four backstage mazes and recover the script.'},onedash:{emoji:'🏃',name:'Prop Delivery Dash',description:'Switch lanes, dodge obstacles, and deliver stage props.'},onelights:{emoji:'💡',name:'Spotlight Switchboard',description:'Solve real light-switch puzzles to brighten the stage.'},onecues:{emoji:'🎛️',name:'Director’s Cue Challenge',description:'Memorize and perform the cues for the big show.'},finale:QUESTS.finale}
};
function questsForGrade(){return GRADE_QUESTS[state.grade]||QUESTS}
function isMissionDone(name){return !!state.done[state.grade+':'+name]||(state.grade==='pk'&&!!state.done[name])}
function setMissionDone(name){state.done[state.grade+':'+name]=true;save()}
const COLORS=[['#fbe8ae','Buttercream'],['#ffd23f','Yellow'],['#f79738','Orange'],['#e35359','Red'],['#e984ac','Pink'],['#a266b8','Purple'],['#5b8ed5','Blue'],['#67bacd','Sky'],['#6ebc70','Green'],['#9adf9f','Mint'],['#8b5c47','Brown'],['#cc986b','Tan'],['#f4d0b1','Peach'],['#aeb1b9','Gray'],['#ffffff','White']];
const STICKERS=['⭐','🍁','🦃','🎀','💖','🍂','🎟️','🎵','🎨','🪶','🎃','🌟']; const PAGES=[{label:'Arthur',emoji:'👓'},{label:'Costume',emoji:'🦃'},{label:'Stage',emoji:'🎭'},{label:'Parade',emoji:'🥁'},{label:'Pumpkins',emoji:'🎃'},{label:'Feast',emoji:'🥧'},{label:'Closet',emoji:'👒'},{label:'Autumn',emoji:'🍁'},{label:'Poster',emoji:'🎟️'},{label:'Curtain',emoji:'✨'}];
const KEY='arthur-thanksgiving-little-stage-v1';let state={grade:null,stars:0,done:{},color:{pages:PAGES.map(()=>({parts:{},stickers:[]}))},sound:true};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){state={...state,...saved,color:{pages:PAGES.map((_,i)=>({parts:saved.color?.pages?.[i]?.parts||{},stickers:saved.color?.pages?.[i]?.stickers||[]}))}}}}catch(e){}
let active='home',mission=null,phase=0,uiTimers=[],rafId=0,audioContext=null,colorPage=0,colorHex='#f79738',stickerChoice=null,colorUndo=[],colorRedo=[],rhythmSeq=[],rhythmInput=0,rhythmStatus='idle',catchRun=null,selectedProp=null,decorated=[],homeDrawer=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function grade(){return GRADES[state.grade]||GRADES.pk}
function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function cancel(){uiTimers.forEach(clearTimeout);uiTimers=[];cancelAnimationFrame(rafId);rafId=0;catchRun=null;clearArcadeHeld();}
function delay(fn,ms){const id=setTimeout(()=>{uiTimers=uiTimers.filter(x=>x!==id);fn()},ms);uiTimers.push(id);return id}
function sound(kind='tick'){if(!state.sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;osc.type='sine';const hz={tick:540,pop:760,good:950,no:280,drum:440,win:1250}[kind]||600;osc.frequency.setValueAtTime(hz,now);osc.frequency.exponentialRampToValueAtTime(hz*.75,now+.13);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.075,now+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+.2);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+.21)}catch(e){}}
function say(text){if(!state.sound)return;try{window.speechSynthesis?.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.85;u.pitch=1.13;u.lang='en-US';window.speechSynthesis.speak(u)}catch(e){}}
function notify(message){toastEl.textContent=message;toastEl.classList.remove('hidden');if(notify.t)clearTimeout(notify.t);notify.t=setTimeout(()=>toastEl.classList.add('hidden'),1750)}
function starBurst(x,y){for(let i=0;i<5;i++){const e=document.createElement('span');e.className='float-star';e.textContent=['⭐','✨','🌟'][i%3];e.style.left=(x+(Math.random()-.5)*100)+'px';e.style.top=(y+(Math.random()-.5)*55)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1050)}}
function award(points,msg){state.stars+=points;save();sound('good');notify('⭐ +'+points+' stars! '+msg)}
function updateGradeSwitcher(){document.querySelectorAll('[data-grade-switch]').forEach(button=>{const selected=button.dataset.gradeSwitch===state.grade;button.classList.toggle('active',selected);button.setAttribute('aria-pressed',String(selected));button.title=selected?grade().label+' — current grade':'Switch to '+GRADES[button.dataset.gradeSwitch].label})}
function switchGrade(key){if(!GRADES[key])return;try{window.speechSynthesis?.cancel()}catch(e){}if(state.grade===key){hub();notify('You are playing '+grade().label+'!');return}state.grade=key;save();hub();notify('Now playing: '+grade().label+'. Progress saved!')}
function setScreen(key,html){cancel();active=key;S.dataset.screen=key;S.innerHTML=html;S.scrollTop=0;window.scrollTo({top:0,behavior:'instant'});gradeLabel.textContent=state.grade?grade().label+' • Tap a grade above to switch':'Tap Pre-K, K, or 1st to start!';updateGradeSwitcher()}
const avatar=`<svg viewBox="0 0 300 390" role="img" aria-label="Original cartoon illustration of Arthur as the school play director" xmlns="http://www.w3.org/2000/svg"><ellipse cx="144" cy="375" rx="94" ry="14" fill="#8a3457" opacity=".27"/><path d="M99 92 Q65 -3 111 13 Q145 21 129 99" fill="#cf9b72" stroke="#6e424f" stroke-width="8"/><path d="M171 93 Q189 -1 226 20 Q252 42 196 108" fill="#cf9b72" stroke="#6e424f" stroke-width="8"/><path d="M108 48Q99 32 117 35Q128 38 121 55 M200 45Q218 28 223 41Q230 56 208 69" fill="#f5c6ad"/><path d="M75 126 Q89 67 160 71 Q244 72 253 147Q263 227 164 242Q63 239 61 168Z" fill="#d8a77f" stroke="#694353" stroke-width="8"/><ellipse cx="156" cy="172" rx="93" ry="77" fill="#e8bc94"/><ellipse cx="112" cy="141" rx="35" ry="40" fill="#fff8e8" stroke="#614558" stroke-width="6"/><ellipse cx="190" cy="141" rx="35" ry="40" fill="#fff8e8" stroke="#614558" stroke-width="6"/><path d="M147 135Q154 129 160 135" fill="none" stroke="#614558" stroke-width="7"/><circle cx="122" cy="147" r="9" fill="#412b3c"/><circle cx="181" cy="147" r="9" fill="#412b3c"/><ellipse cx="157" cy="184" rx="26" ry="20" fill="#b67669" stroke="#6e4556" stroke-width="5"/><ellipse cx="149" cy="180" rx="6" ry="6" fill="#5b3642"/><path d="M135 214Q158 239 184 211" fill="none" stroke="#6e424f" stroke-width="7" stroke-linecap="round"/><path d="M96 234Q161 208 221 239L244 341Q144 379 72 339Z" fill="#e4a640" stroke="#734453" stroke-width="8"/><path d="M132 252L145 278L161 251" fill="none" stroke="#fff6e0" stroke-width="8"/><path d="M78 267L28 217M220 269L269 208" fill="none" stroke="#c99571" stroke-width="25" stroke-linecap="round"/><path d="M30 218l-4-23m2 23l-17-10m16 11l19-6 M263 211l15-19m-17 18l19 5" stroke="#a67969" stroke-width="9" stroke-linecap="round"/><path d="M112 348L104 371M201 350L204 371" stroke="#694353" stroke-width="23" stroke-linecap="round"/><path d="M88 370Q103 354 131 369 M181 372Q202 359 222 371" stroke="#523e5b" stroke-width="15" stroke-linecap="round"/></svg>`;

// Scavenger hunt: four unique scenes with varied targets and distractions.
const huntScenes=[{name:'The Costume Room',title:'Find the costume pieces',targets:['🪶','🎀','👒','🧵','🦃'],distractors:['🍎','🚲','⚽','🚀','🧊']},{name:'The School Hallway',title:'Find the play decorations',targets:['🍁','🍂','🎃','⭐','🎭'],distractors:['🍕','👟','🐟','🚗','🎾']},{name:'The Stage',title:'Find the stage props',targets:['🪑','🎩','🎵','🎺','🎻'],distractors:['🐶','🍦','🛹','🌵','🥦']},{name:'The Dressing Room',title:'Find the finishing touches',targets:['👓','🧶','🪡','🪞','👑'],distractors:['🪁','🐙','🍋','🦖','🚜']}];let huntFound=[],huntTargets=[],huntItems=[];
function startHunt(){mission='hunt';phase=0;renderHunt()}
function renderHunt(){const data=huntScenes[phase],n=grade().huntTargets;huntTargets=data.targets.slice(0,n);huntFound=[];const raw=[...huntTargets.map(e=>({emoji:e,target:true})),...data.distractors.slice(0,grade().huntDistractors).map(e=>({emoji:e,target:false}))];for(let i=raw.length-1;i>0;i--){const j=(i*7+phase*3)% (i+1);[raw[i],raw[j]]=[raw[j],raw[i]];}huntItems=raw.map((e,i)=>({...e,x:18+(i%5)*16+((i*7+phase*2)%3)*2,y:31+Math.floor(i/5)*30}));const direction=`Find ${n} things Arthur needs for the play. Tap the pictures shown at the bottom.`;setScreen('hunt',missionShell('🔎 The Turkey Hunt',phase+1,4,`${instruct(direction)}<div class="world" id="huntWorld"><div class="stage-curtains"></div><div class="stage-curtains right"></div><div class="world-title">${data.name}</div><div class="world-floor"></div>${huntItems.map((it,i)=>`<button class="prop" data-i="${i}" style="left:${it.x}%;top:${it.y}%" aria-label="${it.emoji}">${it.emoji}</button>`).join('')}</div><div class="info-line" id="huntInfo">Find: ${huntTargets.join(' ')}</div><div class="progress-track"><div class="progress-fill" id="huntFill"></div></div>`));hookupBack();hookupSpeak(direction);S.querySelectorAll('.prop').forEach(b=>b.onclick=()=>{const ix=+b.dataset.i,it=huntItems[ix];if(!it.target){sound('no');notify('That is not a play prop. Try another!');return}if(huntFound.includes(it.emoji))return;huntFound.push(it.emoji);b.classList.add('collected');starBurst(innerWidth/2,innerHeight/2);sound('pop');document.getElementById('huntInfo').textContent='Found '+huntFound.length+' of '+n+' · Need: '+huntTargets.filter(x=>!huntFound.includes(x)).join(' ');document.getElementById('huntFill').style.width=(huntFound.length/n*100)+'%';if(huntFound.length>=n)delay(()=>{phase++;if(phase<4){award(3,'You found all the props!');renderHunt()}else finish('hunt','Prop Detective','🔎',18)},850)})}
// Rhythm memory: genuine listen-and-repeat patterns with grade-specific length.
const beatIcons=['👏','🦶','🙌'];const beatNames=['clap','stomp','wave'];
function startRhythm(){mission='rhythm';phase=0;renderRhythm()}
function renderRhythm(){const len=grade().beats[phase];rhythmSeq=Array.from({length:len},(_,i)=>(phase*2+i*7+(i*i)%3)%3);rhythmInput=0;rhythmStatus='ready';const dir='Watch Arthur’s dance steps. Then tap the steps in the same order.';setScreen('rhythm',missionShell('🥁 Turkey Dance Rehearsal',phase+1,4,`${instruct(dir)}<div class="sequence-display" id="sequenceDisplay">Ready to watch the dance?</div><div class="rhythm-stage" id="rhythmStage">${beatIcons.map((icon,i)=>`<button class="beat" data-beat="${i}" aria-label="${beatNames[i]}" disabled>${icon}</button>`).join('')}</div><div class="rhythm-foot"><button class="primary purple" id="watchDance">▶ Watch the Dance</button><button class="tiny" id="replayDance" disabled>🔁 Show It Again</button></div><div class="progress-track"><div class="progress-fill" id="beatFill"></div></div>`));hookupBack();hookupSpeak(dir);document.getElementById('watchDance').onclick=playSequence;document.getElementById('replayDance').onclick=playSequence;S.querySelectorAll('[data-beat]').forEach(b=>b.onclick=()=>rhythmTap(Number(b.dataset.beat)))}
function playSequence(){if(rhythmStatus==='watching')return;rhythmStatus='watching';document.getElementById('watchDance').disabled=true;document.getElementById('replayDance').disabled=true;S.querySelectorAll('[data-beat]').forEach(b=>b.disabled=true);document.getElementById('sequenceDisplay').textContent='Watch carefully! 👀';rhythmSeq.forEach((v,i)=>delay(()=>{const b=S.querySelector(`[data-beat="${v}"]`);if(b)b.classList.add('lit');sound('drum');delay(()=>b?.classList.remove('lit'),380)},500+i*720));delay(()=>{rhythmStatus='input';rhythmInput=0;document.getElementById('sequenceDisplay').textContent='Your turn! Tap the dance steps.';S.querySelectorAll('[data-beat]').forEach(b=>b.disabled=false);document.getElementById('replayDance').disabled=false;},550+rhythmSeq.length*720)}
function rhythmTap(v){if(rhythmStatus!=='input')return;const b=S.querySelector(`[data-beat="${v}"]`);b?.classList.add('lit');delay(()=>b?.classList.remove('lit'),170);sound('tick');if(v!==rhythmSeq[rhythmInput]){rhythmStatus='ready';document.getElementById('sequenceDisplay').textContent='Almost! Watch it again. 💛';S.querySelectorAll('[data-beat]').forEach(b=>b.disabled=true);document.getElementById('watchDance').disabled=false;document.getElementById('replayDance').disabled=false;document.getElementById('beatFill').style.width='0%';return}rhythmInput++;document.getElementById('beatFill').style.width=(rhythmInput/rhythmSeq.length*100)+'%';if(rhythmInput===rhythmSeq.length){rhythmStatus='complete';S.querySelectorAll('[data-beat]').forEach(b=>b.disabled=true);document.getElementById('sequenceDisplay').textContent='Perfect dance! ⭐';sound('win');delay(()=>{phase++;if(phase<4){award(4,'Great dance!');renderRhythm()}else finish('rhythm','Dance Captain','🥁',18)},900)}}

const catchSet=['🍁','🎭','⭐','🍂','🎀'];const catchBad=['🥦','🧊','🚗'];
function startCatch(){mission='catch';phase=0;renderCatch()}
function renderCatch(){const target=grade().catchGoal[phase],time=grade().catchTimes[phase];const dir='Move your finger left and right. Catch the play props. Avoid the silly objects.';setScreen('catch',missionShell('🧺 Backstage Prop Catch',phase+1,3,`${instruct(dir)}<div class="catch-top"><b id="catchCount">⭐ 0 / ${target}</b><b id="catchTime">⏱️ ${time}s</b></div><div class="world catch-world" id="catchWorld"><div class="stage-curtains" style="bottom:27%"></div><div class="stage-curtains right" style="bottom:27%"></div><div class="basket" id="catchBasket">🧺</div></div><p class="catch-hint" id="catchHint">Move your finger, then tap START!</p><div style="text-align:center"><button class="primary teal" id="catchStart">▶ Start Catching</button></div>`));hookupBack();hookupSpeak(dir);const world=document.getElementById('catchWorld');let moved=false;function position(clientX){const rect=world.getBoundingClientRect();if(!catchRun){const x=Math.max(50,Math.min(rect.width-50,clientX-rect.left));world.querySelector('#catchBasket').style.left=x+'px';return}catchRun.x=Math.max(50,Math.min(rect.width-50,clientX-rect.left));world.querySelector('#catchBasket').style.left=catchRun.x+'px';moved=true}world.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)position(e.clientX)});world.addEventListener('pointerdown',e=>{world.setPointerCapture?.(e.pointerId);position(e.clientX)});window.onkeydown=e=>{if(active==='catch'&&catchRun&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();catchRun.x=Math.max(50,Math.min(world.clientWidth-50,catchRun.x+(e.key==='ArrowLeft'?-35:35)));world.querySelector('#catchBasket').style.left=catchRun.x+'px'}};document.getElementById('catchStart').onclick=()=>startCatchRound(world,target,time)}
function startCatchRound(world,target,time){const btn=document.getElementById('catchStart');btn.classList.add('hidden');document.getElementById('catchHint').textContent='Catch the decorations! 🍁 ⭐ 🎀';catchRun={x:world.clientWidth/2,score:0,items:[],start:performance.now(),last:performance.now(),spawn:0,miss:0};const run=catchRun,sp=grade().catchSpeed,seconds=time;const basket=document.getElementById('catchBasket');const frame=(now)=>{if(active!=='catch'||catchRun!==run)return;const dt=Math.min(.05,(now-run.last)/1000),elapsed=(now-run.start)/1000;run.last=now;run.spawn+=dt;const rect=world.getBoundingClientRect();const fallEvery=state.grade==='pk'?.83:state.grade==='k'?.68:.54;if(run.spawn>fallEvery){run.spawn=0;const good=Math.random()>.21;const emoji=(good?catchSet:catchBad)[Math.floor(Math.random()*(good?catchSet.length:catchBad.length))];const obj=document.createElement('div');obj.className='catch-object';obj.textContent=emoji;world.appendChild(obj);run.items.push({el:obj,x:30+Math.random()*(rect.width-60),y:-40,good,velocity:sp*(.75+Math.random()*.55)})}for(const item of [...run.items]){item.y+=item.velocity*dt;item.el.style.left=item.x+'px';item.el.style.top=item.y+'px';if(item.y>rect.height-115&&item.y<rect.height-39&&Math.abs(item.x-run.x)<68){if(item.good){run.score++;sound('pop');document.getElementById('catchCount').textContent=`⭐ ${run.score} / ${target}`;starBurst(rect.left+item.x,rect.top+rect.height-90)}else{sound('no');notify('Oops! Catch the stage props.')}item.el.remove();run.items.splice(run.items.indexOf(item),1)}else if(item.y>rect.height){item.el.remove();run.items.splice(run.items.indexOf(item),1);}}document.getElementById('catchTime').textContent=`⏱️ ${Math.max(0,Math.ceil(seconds-elapsed))}s`;if(elapsed>=seconds||run.score>=target){const success=run.score>=target;run.items.forEach(x=>x.el.remove());catchRun=null;if(success){delay(()=>{phase++;if(phase<3){award(5,'Great catching!');renderCatch()}else finish('catch','Prop Catcher','🧺',18)},650)}else{document.getElementById('catchHint').textContent=`You caught ${run.score}! Let's try the round again.`;btn.classList.remove('hidden');btn.textContent='🔁 Try Again';sound('tick')}return}rafId=requestAnimationFrame(frame)};rafId=requestAnimationFrame(frame)}

function completeAdventureRoom(){if(!adventure)return;const a=adventure,room=a.room,lv=ADVENTURE_ROOMS[room];sound('win');const done=room===ADVENTURE_ROOMS.length-1;if(!done){state.adventure={room:room+1,best:Math.max(state.adventure?.best||0,room+1)};save();award(8,lv.name+' rescued!')}else{state.adventure={room:0,best:6};save();if(!isMissionDone('onearcade')){setMissionDone('onearcade');award(40,'Arthur’s whole play is saved!')}}setScreen('arcadeResult',`<div class="result"><div class="big">${done?'🎭🦃🎉':'🎬⭐'}</div><div class="badge">${done?'🏆 Backstage Rescue Champion':'🌟 Scene Saved'}</div><h2>${done?'The Show Must Go On!':'Great Work, Director!'}</h2><p>${done?'You found the costume, script, stage lights, and opened the curtain. Arthur’s Thanksgiving play is ready!':`You finished ${esc(lv.name)}. Chapter ${room+2} is ready!`}</p><div class="actions"><button class="primary" id="arcadeNext">${done?'▶ Play Again':'▶ Next Chapter'}</button><button class="secondary" id="arcadeColor">🎨 Coloring Studio</button><button class="secondary" id="arcadeHub">← Play Pass</button></div></div>`);document.getElementById('arcadeNext').onclick=()=>startOneArcade(done);document.getElementById('arcadeColor').onclick=openColor;document.getElementById('arcadeHub').onclick=hub}
function frameAdventure(now){if(active!=='onearcade'||!adventure)return;arcadeTime=now;const a=adventure,lv=ADVENTURE_ROOMS[a.room];const canvas=document.getElementById('adventureCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');const colors=ARCADE_PALETTES[lv.theme];ctx.clearRect(0,0,960,600);
 const grad=ctx.createLinearGradient(0,0,960,600);grad.addColorStop(0,colors[1]);grad.addColorStop(1,colors[0]);ctx.fillStyle=grad;ctx.fillRect(0,0,960,600);
 for(let y=0;y<10;y++)for(let x=0;x<16;x++){const at=lv.map[y][x],px=x*60,py=y*60;ctx.fillStyle=at==='#'?colors[2]:(x+y)%2===0?'#ffffff20':'#6b456318';ctx.fillRect(px+2,py+2,56,56);if(at==='#'){ctx.fillStyle=colors[3];ctx.fillRect(px+5,py+46,50,10);ctx.strokeStyle='#fff7';ctx.lineWidth=3;ctx.strokeRect(px+6,py+6,48,42)}else{ctx.fillStyle='#fff6';ctx.fillRect(px+22,py+18,5,5)}}
 // Decorations make each room feel different without obscuring the path.
 ctx.globalAlpha=.22;ctx.font='28px serif';for(let i=0;i<6;i++){ctx.fillText(['🍁','🎭','⭐','🪶','🎀','🍂'][i],88+i*140,60+Math.sin(i+a.room)*20)}ctx.globalAlpha=1;
 function pick(x,y,emoji,glow='#fef0a7',size=34){ctx.save();ctx.shadowColor=glow;ctx.shadowBlur=18+8*Math.sin(now/250);ctx.fillStyle='#fffdf0';ctx.beginPath();ctx.arc(x*60+30,y*60+30,25,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;ctx.fillText(emoji,x*60+30,y*60+31);ctx.restore()}
 lv.props.forEach((p,i)=>{if(!a.collected.has(i))pick(p[0],p[1],['📜','🎨','🎭','🪶','🎀','⭐'][i%6])});if(!a.key)pick(...lv.key,'🔑','#fbd55a');lv.switches.forEach((p,i)=>pick(p[0],p[1],a.lights.has(i)?'🌟':'💡',a.lights.has(i)?'#e8f78b':'#a4e7ff'));
 const ready=a.collected.size===lv.props.length&&a.key&&a.lights.size===lv.switches.length;pick(...lv.exit,ready?'🚪':'🎭',ready?'#e8ff9c':'#eec8a5',36);
 // Animated runaway props. They are hazards, but cause a gentle reset, never game over.
 lv.hazards.forEach((h,i)=>{const shift=Math.sin(now*h.speed/850+i*1.6)*h.range;const hx=h.x+(h.axis==='x'?shift:0),hy=h.y+(h.axis==='y'?shift:0);pick(hx,hy,['🧺','🎲','🌀'][i%3],'#ffa2a2',32);if(now>a.shieldUntil&&Math.hypot(hx-a.px,hy-a.py)<.55){a.hearts--;a.shieldUntil=now+2200;a.px=lv.start[0];a.py=lv.start[1];a.oldX=a.px;a.oldY=a.py;notify(a.hearts>0?'Whoops! Arthur bumped a moving prop.':'Arthur gets a fresh start and full hearts!');sound('no');if(a.hearts<=0)a.hearts=3;updateAdventureHud()}});
 const progress=Math.min(1,(now-a.lastWalk)/140),ax=(a.oldX+(a.px-a.oldX)*progress)*60+30,ay=(a.oldY+(a.py-a.oldY)*progress)*60+30;ctx.save();if(now<a.shieldUntil&&Math.floor(now/160)%2)ctx.globalAlpha=.55;drawCanvasArthur(ctx,ax,ay,now);ctx.restore();rafId=requestAnimationFrame(frameAdventure)
}
function drawCanvasArthur(ctx,x,y,t){ctx.save();ctx.translate(x,y+Math.sin(t/140)*1.2);ctx.shadowColor='#59365088';ctx.shadowBlur=9;ctx.fillStyle='#74465c';ctx.beginPath();ctx.ellipse(0,20,21,8,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#674453';ctx.lineWidth=2.3;
 ctx.fillStyle='#ecb84d';ctx.beginPath();ctx.ellipse(0,10,19,20,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#dcb28a';ctx.beginPath();ctx.ellipse(-15,-20,8,19,-.35,0,Math.PI*2);ctx.ellipse(16,-20,8,19,.35,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(0,-11,25,23,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-10,-14,10,0,Math.PI*2);ctx.arc(11,-14,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(2,-14);ctx.stroke();ctx.fillStyle='#543949';ctx.beginPath();ctx.arc(-7,-12,3.2,0,Math.PI*2);ctx.arc(9,-12,3.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d29379';ctx.beginPath();ctx.ellipse(1,0,11,6,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}
window.addEventListener('keydown',ev=>{if(active!=='onearcade'||!adventure)return;const dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'};if(dirs[ev.key]){ev.preventDefault();if(ev.repeat)return;moveAdventure(dirs[ev.key])}if(ev.key===' '){ev.preventDefault();document.getElementById('arcadeBoost')?.click()}});

// Header actions and initial screen.
document.querySelectorAll('[data-grade-switch]').forEach(b=>b.onclick=()=>switchGrade(b.dataset.gradeSwitch));document.getElementById('homeBtn').onclick=goHome;document.getElementById('audioBtn').onclick=()=>{state.sound=!state.sound;save();document.getElementById('audioBtn').textContent=state.sound?'🔊 Sound':'🔇 Muted';if(!state.sound)try{window.speechSynthesis?.cancel()}catch(e){}};document.getElementById('audioBtn').textContent=state.sound?'🔊 Sound':'🔇 Muted';window.addEventListener('visibilitychange',()=>{if(document.hidden){try{window.speechSynthesis?.cancel()}catch(e){}}});goHome();
})();
</script>
</body></html>

-actions button{padding:9px 12px;font-size:14px}.color-footer{text-align:center;font-size:14px;font-weight:800;color:#765363;margin-top:12px}

/* Three genuinely different age pathways */
.quest.kpattern,.quest.kmemory,.quest.kcostume,.quest.korder{background:#fff3d7}
.quest.onemaze,.quest.onedash,.quest.onelights,.quest.onecues{background:#e9edff}
.game-copy{font-weight:900;color:#704e66;text-align:center;font-size:clamp(17px,2.2vw,23px);line-height:1.4;padding:10px}
.game-note{padding:10px;background:#ffefbf;border:2px solid #dbb88b;border-radius:15px;font-weight:900;text-align:center;margin:12px auto}
.puzzle-pill{background:#fff;border:3px solid #a27686;border-radius:20px;padding:14px 20px;min-height:65px;font-size:clamp(26px,4.5vw,42px);font-weight:900;color:#67425c;box-shadow:0 5px 0 #8f627766;touch-action:manipulation}
.pattern-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:25px 10px;background:#fae9cc;border-radius:25px;border:3px dashed #b37e80;min-height:130px}
.pattern-row .puzzle-pill{min-width:66px;min-height:75px;background:#fffaf1;display:grid;place-items:center}
.pattern-row .unknown{background:#f7b7dc;color:#714760;animation:blink 1.5s ease-in-out infinite}
.puzzle-options{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin:25px auto}
.puzzle-options button{min-width:80px;font-size:45px}
.memory-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:690px;margin:20px auto}
.memory-card{min-height:95px;aspect-ratio:1/1;border:4px solid #8a5474;border-radius:20px;background:linear-gradient(135deg,#dca3d0,#9c62ba);color:white;font-size:clamp(31px,5vw,56px);box-shadow:0 6px 0 #773d69;display:grid;place-items:center}
.memory-card.up{background:#fff8e8;color:#573c52}.memory-card.matched{background:#c6edd0;border-color:#448977;opacity:.85}
.workshop{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px auto;max-width:800px}
.work-panel{background:#fff7e9;border:4px solid #ac8290;border-radius:25px;padding:16px;text-align:center}.work-panel h3{margin:4px 0 16px}
.work-list{display:flex;gap:13px;flex-wrap:wrap;justify-content:center}.work-piece,.work-target{width:clamp(72px,9vw,106px);height:clamp(72px,9vw,106px);font-size:clamp(35px,5vw,56px);border-radius:22px;border:4px solid #996783;background:white;box-shadow:0 5px 0 #633f5670}
.work-piece.selected{background:#ffe390;outline:5px solid #df9154}.work-target{border-style:dashed;background:#f3e3d2;color:#ac8f97}.work-target.done{background:#d3f4da;border-color:#50876a;border-style:solid}
.order-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px auto}.order-chip{padding:13px;border:3px solid #9d6980;background:#fffdf4;border-radius:15px;font-size:40px;min-width:75px}.order-chip.done{background:#c4efd8}.order-chip.disabled{opacity:.4}

<body><div id="app">
<header><div><strong>🦃 Arthur's Thanksgiving</strong><small id="gradeLabel">Three Grade Adventures • Pre-K, K & First</small></div><div class="btns"><button class="tiny" id="homeBtn" aria-label="Go to main menu">⌂ Home</button><button class="tiny" id="audioBtn" aria-label="Toggle sound">🔊 Sound</button></div></header>
<main id="screen" class="screen" aria-live="polite"></main><div id="toast" class="toast hidden" role="status"></div>
</div>
<script>
(()=>{'use strict';
const S=document.getElementById('screen'),toastEl=document.getElementById('toast'),gradeLabel=document.getElementById('gradeLabel');
const GRADES={pk:{label:'Pre-K',emoji:'🐣',desc:'Coloring, easy turkey hunt, dance, and playful surprises',huntTargets:3,huntDistractors:3,beats:[2,2,3,3],catchTimes:[27,30,30],catchSpeed:90,catchGoal:[5,6,7],stageSlots:2,colorGoal:9},k:{label:'Kindergarten',emoji:'🧩',desc:'A separate costume workshop with puzzles, memory, and story order',huntTargets:4,huntDistractors:4,beats:[3,3,4,4],catchTimes:[30,32,32],catchSpeed:119,catchGoal:[7,8,9],stageSlots:3,colorGoal:13},one:{label:'First Grade',emoji:'⭐',desc:'A separate backstage adventure with mazes, arcade runs, and light puzzles',huntTargets:5,huntDistractors:5,beats:[4,4,5,6],catchTimes:[32,35,37],catchSpeed:150,catchGoal:[10,11,12],stageSlots:4,colorGoal:18}};
const QUESTS={story:{emoji:'📖',name:'The Big Problem',description:'Hear how Arthur’s Thanksgiving play begins.'},hunt:{emoji:'🔎',name:'The Turkey Hunt',description:'Explore backstage to recover the missing props.'},color:{emoji:'🎨',name:'Coloring Studio',description:'Color Arthur, a turkey costume, and the stage.'},rhythm:{emoji:'🥁',name:'Rehearsal Dance',description:'Watch, remember, and tap the dance steps.'},catch:{emoji:'🧺',name:'Prop Catch!',description:'Slide the basket to catch falling decorations.'},finale:{emoji:'🎭',name:'The Big Show',description:'Put the play together and watch the finale.'}};
const GRADE_QUESTS={
  pk:QUESTS,
  k:{story:QUESTS.story,color:QUESTS.color,kpattern:{emoji:'🍂',name:'Leaf Pattern Parade',description:'Figure out the missing part of a growing pattern.'},kmemory:{emoji:'🃏',name:'Backstage Memory',description:'Flip cards and find matching Thanksgiving pairs.'},kcostume:{emoji:'🪶',name:'Turkey Costume Workshop',description:'Choose pieces and put them in matching costume slots.'},korder:{emoji:'🎬',name:'Get the Play Ready',description:'Put school-play events in the right order.'},finale:QUESTS.finale},
  one:{story:QUESTS.story,color:QUESTS.color,onemaze:{emoji:'🗺️',name:'Script Quest Maze',description:'Explore four backstage mazes and recover the script.'},onedash:{emoji:'🏃',name:'Prop Delivery Dash',description:'Switch lanes, dodge obstacles, and deliver stage props.'},onelights:{emoji:'💡',name:'Spotlight Switchboard',description:'Solve real light-switch puzzles to brighten the stage.'},onecues:{emoji:'🎛️',name:'Director’s Cue Challenge',description:'Memorize and perform the cues for the big show.'},finale:QUESTS.finale}
};
function questsForGrade(){return GRADE_QUESTS[state.grade]||QUESTS}
function isMissionDone(name){return !!state.done[state.grade+':'+name]||(state.grade==='pk'&&!!state.done[name])}
function setMissionDone(name){state.done[state.grade+':'+name]=true;save()}
const COLORS=[['#fbe8ae','Buttercream'],['#ffd23f','Yellow'],['#f79738','Orange'],['#e35359','Red'],['#e984ac','Pink'],['#a266b8','Purple'],['#5b8ed5','Blue'],['#67bacd','Sky'],['#6ebc70','Green'],['#9adf9f','Mint'],['#8b5c47','Brown'],['#cc986b','Tan'],['#f4d0b1','Peach'],['#aeb1b9','Gray'],['#ffffff','White']];
const STICKERS=['⭐','🍁','🦃','🎀','💖','🍂']; const PAGES=[{label:'Arthur',emoji:'👓'},{label:'Costume',emoji:'🦃'},{label:'Stage',emoji:'🎭'}];
const KEY='arthur-thanksgiving-little-stage-v1';let state={grade:null,stars:0,done:{},color:{pages:[{parts:{},stickers:[]},{parts:{},stickers:[]},{parts:{},stickers:[]}]},sound:true};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){state={...state,...saved,color:{pages:[0,1,2].map(i=>({parts:saved.color?.pages?.[i]?.parts||{},stickers:saved.color?.pages?.[i]?.stickers||[]}))}}}}catch(e){}
let active='home',mission=null,phase=0,uiTimers=[],rafId=0,audioContext=null,colorPage=0,colorHex='#f79738',stickerChoice=null,colorUndo=[],colorRedo=[],rhythmSeq=[],rhythmInput=0,rhythmStatus='idle',catchRun=null,selectedProp=null,decorated=[],homeDrawer=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function grade(){return GRADES[state.grade]||GRADES.pk}
function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function cancel(){uiTimers.forEach(clearTimeout);uiTimers=[];cancelAnimationFrame(rafId);rafId=0;catchRun=null;}
function delay(fn,ms){const id=setTimeout(()=>{uiTimers=uiTimers.filter(x=>x!==id);fn()},ms);uiTimers.push(id);return id}
function sound(kind='tick'){if(!state.sound)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;osc.type='sine';const hz={tick:540,pop:760,good:950,no:280,drum:440,win:1250}[kind]||600;osc.frequency.setValueAtTime(hz,now);osc.frequency.exponentialRampToValueAtTime(hz*.75,now+.13);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.075,now+.018);gain.gain.exponentialRampToValueAtTime(.0001,now+.2);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+.21)}catch(e){}}
function say(text){if(!state.sound)return;try{window.speechSynthesis?.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.85;u.pitch=1.13;u.lang='en-US';window.speechSynthesis.speak(u)}catch(e){}}
function notify(message){toastEl.textContent=message;toastEl.classList.remove('hidden');if(notify.t)clearTimeout(notify.t);notify.t=setTimeout(()=>toastEl.classList.add('hidden'),1750)}
function starBurst(x,y){for(let i=0;i<5;i++){const e=document.createElement('span');e.className='float-star';e.textContent=['⭐','✨','🌟'][i%3];e.style.left=(x+(Math.random()-.5)*100)+'px';e.style.top=(y+(Math.random()-.5)*55)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1050)}}
function award(points,msg){state.stars+=points;save();sound('good');notify('⭐ +'+points+' stars! '+msg)}
function setScreen(key,html){cancel();active=key;S.dataset.screen=key;S.innerHTML=html;S.scrollTop=0;window.scrollTo({top:0,behavior:'instant'});gradeLabel.textContent=state.grade?grade().label+' • Three Grade Adventures':'Three Grade Adventures • Pre-K, K & First'}
const avatar=`<svg viewBox="0 0 300 390" role="img" aria-label="Original cartoon illustration of Arthur as the school play director" xmlns="http://www.w3.org/2000/svg"><ellipse cx="144" cy="375" rx="94" ry="14" fill="#8a3457" opacity=".27"/><path d="M99 92 Q65 -3 111 13 Q145 21 129 99" fill="#cf9b72" stroke="#6e424f" stroke-width="8"/><path d="M171 93 Q189 -1 226 20 Q252 42 196 108" fill="#cf9b72" stroke="#6e424f" stroke-width="8"/><path d="M108 48Q99 32 117 35Q128 38 121 55 M200 45Q218 28 223 41Q230 56 208 69" fill="#f5c6ad"/><path d="M75 126 Q89 67 160 71 Q244 72 253 147Q263 227 164 242Q63 239 61 168Z" fill="#d8a77f" stroke="#694353" stroke-width="8"/><ellipse cx="156" cy="172" rx="93" ry="77" fill="#e8bc94"/><ellipse cx="112" cy="141" rx="35" ry="40" fill="#fff8e8" stroke="#614558" stroke-width="6"/><ellipse cx="190" cy="141" rx="35" ry="40" fill="#fff8e8" stroke="#614558" stroke-width="6"/><path d="M147 135Q154 129 160 135" fill="none" stroke="#614558" stroke-width="7"/><circle cx="122" cy="147" r="9" fill="#412b3c"/><circle cx="181" cy="147" r="9" fill="#412b3c"/><ellipse cx="157" cy="184" rx="26" ry="20" fill="#b67669" stroke="#6e4556" stroke-width="5"/><ellipse cx="149" cy="180" rx="6" ry="6" fill="#5b3642"/><path d="M135 214Q158 239 184 211" fill="none" stroke="#6e424f" stroke-width="7" stroke-linecap="round"/><path d="M96 234Q161 208 221 239L244 341Q144 379 72 339Z" fill="#e4a640" stroke="#734453" stroke-width="8"/><path d="M132 252L145 278L161 251" fill="none" stroke="#fff6e0" stroke-width="8"/><path d="M78 267L28 217M220 269L269 208" fill="none" stroke="#c99571" stroke-width="25" stroke-linecap="round"/><path d="M30 218l-4-23m2 23l-17-10m16 11l19-6 M263 211l15-19m-17 18l19 5" stroke="#a67969" stroke-width="9" stroke-linecap="round"/><path d="M112 348L104 371M201 350L204 371" stroke="#694353" stroke-width="23" stroke-linecap="round"/><path d="M88 370Q103 354 131 369 M181 372Q202 359 222 371" stroke="#523e5b" stroke-width="15" stroke-linecap="round"/></svg>`;
function goHome(){setScreen('home',`<div class="hero"><div class="hero-text"><span class="script">📖 Based on the school Thanksgiving play story</span><h1>Arthur’s<br><em>Thanksgiving!</em></h1><p>Arthur needs help with the school play. Nobody wants to be the turkey! Play, color, rehearse, and make the show shine.</p><div class="hero-actions"><button class="primary" id="playNow">▶ ${state.grade?'Continue Playing':'Choose My Grade'}</button><button class="primary pink" id="quickColor">🎨 Coloring Studio</button></div></div><div class="hero-illustration">${avatar}</div></div><div class="ribbon"><span>🐣 Pre-K</span><span>🧩 Kindergarten</span><span>⭐ First grade</span><span>📱 Made for iPad</span><span>🎨 Three coloring pages</span></div>`);document.getElementById('playNow').onclick=()=>state.grade?hub():chooseGrade();document.getElementById('quickColor').onclick=()=>{if(!state.grade){state.grade='pk';save()}openColor()}}
function chooseGrade(){setScreen('grades',`<div class="page-heading"><h2>Who is playing today?</h2><p>Choose a grade so the challenges fit your class. Each grade has its OWN games. Everyone also has a coloring studio and a happy ending!</p></div><div class="grade-cards">${Object.entries(GRADES).map(([key,v])=>`<button class="grade-card" data-grade="${key}"><span class="emoji">${v.emoji}</span><span><strong>${v.label}</strong><small>${v.desc}</small></span></button>`).join('')}</div><p class="small-note">All activities use finger-friendly controls. No reading required when the 🔊 button is used.</p>`);S.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{state.grade=b.dataset.grade;save();hub()})}
function hub(){setScreen('hub',`<div class="hub-banner"><div><h2>${state.grade==='one'?'🎬 First Grade Director Academy':state.grade==='k'?'🧩 Kindergarten Play Workshop':'🎟️ Little Turkey Play Pass'}</h2><p>${grade().label}: ${state.grade==='one'?'Explore, solve, and save the school play.':state.grade==='k'?'Build costumes, solve picture puzzles, and get the play ready.':'Help Arthur get the Thanksgiving play ready.'} Choose any mission!</p></div><div class="score">⭐ ${state.stars}</div></div><div class="quest-grid">${Object.entries(questsForGrade()).map(([key,q])=>`<button class="quest ${key==='color'?'coloring':key}" data-quest="${key}"><span class="q-emoji">${q.emoji}</span><strong>${q.name}</strong><small>${q.description}</small><span class="status">${isMissionDone(key)?'✅ Star earned':'▶ Play now'}</span></button>`).join('')}</div><div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap"><button class="secondary" id="changeGrade">🔁 Change grade</button><button class="secondary" id="storyAgain">📖 Hear the story</button></div><p class="small-note">⭐ Every child can replay missions. Progress and coloring are saved on this iPad.</p>`);S.querySelectorAll('[data-quest]').forEach(btn=>btn.onclick=()=>openQuest(btn.dataset.quest));document.getElementById('changeGrade').onclick=chooseGrade;document.getElementById('storyAgain').onclick=()=>openQuest('story')}
function openQuest(name){if(name==='color')return openColor();if(name==='story')return openStory();if(name==='hunt')return startHunt();if(name==='rhythm')return startRhythm();if(name==='catch')return startCatch();if(name==='finale')return startFinale();if(name==='kpattern')return startKPattern();if(name==='kmemory')return startKMemory();if(name==='kcostume')return startKCostume();if(name==='korder')return startKOrder();if(name==='onemaze')return startOneMaze();if(name==='onedash')return startOneDash();if(name==='onelights')return startOneLights();if(name==='onecues')return startOneCues()}
function missionShell(title,round,total,inner){return `<div class="mission"><div class="mission-head"><button class="tiny" id="backHub">← Play Pass</button><h2>${title}</h2><div class="round">${round}/${total}</div></div><div class="storyboard">${inner}</div></div>`}
function hookupBack(){document.getElementById('backHub').onclick=hub}
function instruct(s){return `<div class="instruction"><span>${s}</span><button class="hear" id="speakTask" aria-label="Read directions aloud">🔊 Hear</button></div>`}
function hookupSpeak(text){const b=document.getElementById('speakTask');if(b)b.onclick=()=>say(text)}
function finish(name,label,emoji='🌟',points=15){if(!isMissionDone(name)){setMissionDone(name);award(points,label+' complete!')}else sound('win');setScreen('result',`<div class="result"><div class="big">${emoji}</div><div class="badge">🏅 ${esc(label)} Badge</div><h2>You did it!</h2><p>Arthur is one step closer to the Thanksgiving school play. Your costume-designer and helper skills are amazing!</p><div class="actions"><button class="primary" id="goHub">🎟️ Choose Another Mission</button><button class="secondary" id="goColor">🎨 Color Again</button></div></div>`);document.getElementById('goHub').onclick=hub;document.getElementById('goColor').onclick=openColor}
function openStory(){const chapters=[{icon:'🏫',text:'Arthur is getting ready to direct the school Thanksgiving play.',prompt:'Can you help Arthur get ready?'},{icon:'🦃',text:'There is one big problem: nobody wants to be the turkey!',prompt:'Let’s make the turkey costume fun.'},{icon:'🎨',text:'We can find the missing decorations, color the costumes, and practice the dance.',prompt:'Every helper makes the play better.'},{icon:'🌟',text:'With teamwork and a little creativity, the class can put on a wonderful show!',prompt:'Now it is your turn to help!'}];let i=0;function page(){const c=chapters[i];setScreen('story',`<div class="book-card"><div class="big">${c.icon}</div><h2 style="font-size:clamp(30px,4vw,48px)">Arthur's Thanksgiving Play</h2><p>${c.text}</p><p style="color:#bd6678">${c.prompt}</p><div class="actions"><button class="secondary" id="readPage">🔊 Read to Me</button><button class="primary" id="nextPage">${i===chapters.length-1?'🎟️ Play Games':'Next Page →'}</button></div><p style="font-weight:900;color:#ad8591">Page ${i+1} of ${chapters.length}</p></div>`);document.getElementById('readPage').onclick=()=>say(c.text+' '+c.prompt);document.getElementById('nextPage').onclick=()=>{if(++i<chapters.length)page();else finish('story','Story Helper','📖',8)}}page()}
// Scavenger hunt: four unique scenes with varied targets and distractions.
const huntScenes=[{name:'The Costume Room',title:'Find the costume pieces',targets:['🪶','🎀','👒','🧵','🦃'],distractors:['🍎','🚲','⚽','🚀','🧊']},{name:'The School Hallway',title:'Find the play decorations',targets:['🍁','🍂','🎃','⭐','🎭'],distractors:['🍕','👟','🐟','🚗','🎾']},{name:'The Stage',title:'Find the stage props',targets:['🪑','🎩','🎵','🎺','🎻'],distractors:['🐶','🍦','🛹','🌵','🥦']},{name:'The Dressing Room',title:'Find the finishing touches',targets:['👓','🧶','🪡','🪞','👑'],distractors:['🪁','🐙','🍋','🦖','🚜']}];let huntFound=[],huntTargets=[],huntItems=[];
function startHunt(){mission='hunt';phase=0;renderHunt()}
function renderHunt(){const data=huntScenes[phase],n=grade().huntTargets;huntTargets=data.targets.slice(0,n);huntFound=[];const raw=[...huntTargets.map(e=>({emoji:e,target:true})),...data.distractors.slice(0,grade().huntDistractors).map(e=>({emoji:e,target:false}))];for(let i=raw.length-1;i>0;i--){const j=(i*7+phase*3)% (i+1);[raw[i],raw[j]]=[raw[j],raw[i]];}huntItems=raw.map((e,i)=>({...e,x:18+(i%5)*16+((i*7+phase*2)%3)*2,y:31+Math.floor(i/5)*30}));const direction=`Find ${n} things Arthur needs for the play. Tap the pictures shown at the bottom.`;setScreen('hunt',missionShell('🔎 The Turkey Hunt',phase+1,4,`${instruct(direction)}<div class="world" id="huntWorld"><div class="stage-curtains"></div><div class="stage-curtains right"></div><div class="world-title">${data.name}</div><div class="world-floor"></div>${huntItems.map((it,i)=>`<button class="prop" data-i="${i}" style="left:${it.x}%;top:${it.y}%" aria-label="${it.emoji}">${it.emoji}</button>`).join('')}</div><div class="info-line" id="huntInfo">Find: ${huntTargets.join(' ')}</div><div class="progress-track"><div class="progress-fill" id="huntFill"></div></div>`));hookupBack();hookupSpeak(direction);S.querySelectorAll('.prop').forEach(b=>b.onclick=()=>{const ix=+b.dataset.i,it=huntItems[ix];if(!it.target){sound('no');notify('That is not a play prop. Try another!');return}if(huntFound.includes(it.emoji))return;huntFound.push(it.emoji);b.classList.add('collected');starBurst(innerWidth/2,innerHeight/2);sound('pop');document.getElementById('huntInfo').textContent='Found '+huntFound.length+' of '+n+' · Need: '+huntTargets.filter(x=>!huntFound.includes(x)).join(' ');document.getElementById('huntFill').style.width=(huntFound.length/n*100)+'%';if(huntFound.length>=n)delay(()=>{phase++;if(phase<4){award(3,'You found all the props!');renderHunt()}else finish('hunt','Prop Detective','🔎',18)},850)})}
// Rhythm memory: genuine listen-and-repeat patterns with grade-specific length.
const beatIcons=['👏','🦶','🙌'];const beatNames=['clap','stomp','wave'];

function renderRhythm(){const len=grade().beats[phase];rhythmSeq=Array.from({length:len},(_,i)=>(phase*2+i*7+(i*i)%3)%3);rhythmInput=0;rhythmStatus='ready';const dir='Watch Arthur’s dance steps. Then tap the steps in the same order.';setScreen('rhythm',missionShell('🥁 Turkey Dance Rehearsal',phase+1,4,`${instruct(dir)}<div class="sequence-display" id="sequenceDisplay">Ready to watch the dance?</div><div class="rhythm-stage" id="rhythmStage">${beatIcons.map((icon,i)=>`<button class="beat" data-beat="${i}" aria-label="${beatNames[i]}" disabled>${icon}</button>`).join('')}</div><div class="rhythm-foot"><button class="primary purple" id="watchDance">▶ Watch the Dance</button><button class="tiny" id="replayDance" disabled>🔁 Show It Again</button></div><div class="progress-track"><div class="progress-fill" id="beatFill"></div></div>`));hookupBack();hookupSpeak(dir);document.getElementById('watchDance').onclick=playSequence;document.getElementById('replayDance').onclick=playSequence;S.querySelectorAll('[data-beat]').forEach(b=>b.onclick=()=>rhythmTap(Number(b.dataset.beat)))}

    const lane=(run.wave*7+Math.floor(run.wave/3)+level)%3;
    const em=(good?goodies:baddies)[Math.floor(Math.random()*(good?goodies.length:baddies.length))];
    const el=document.createElement('div');el.className='runner-object';el.textContent=em;el.style.left=(lane*33.333+16.667)+'%';stage.appendChild(el);
    run.items.push({lane,y:-50,el,good,velocity:130+level*22+Math.random()*38});
  }
  const height=stage.clientHeight;
  for(const obj of [...run.items]){
    obj.y+=dt*obj.velocity;obj.el.style.top=obj.y+'px';
    if(obj.y>=height-100&&obj.y<height-35&&obj.lane===run.lane){
      if(obj.good){run.score++;sound('pop');}else{run.hearts--;sound('no');notify('Watch out for obstacles!')}
      obj.el.remove();run.items.splice(run.items.indexOf(obj),1);
    }else if(obj.y>height+40){obj.el.remove();run.items.splice(run.items.indexOf(obj),1)}
  }
  renderScore(elapsed);
  if(run.score>=needed){finishDash(true);return}
  if(run.hearts<=0||elapsed>=seconds){finishDash(false);return}
  rafId=requestAnimationFrame(frame)
 }
 rafId=requestAnimationFrame(frame)
}
const ONE_LIGHT_SCRIPTS=[[0],[0,4],[0,4,8],[1,5,6,7],[0,2,4,6,8]];
let oneLightsLevel=0,oneLightsBoard=[];
function toggleOneLight(i){const cells=[i,i-3,i+3,i-1,i+1].filter(n=>n>=0&&n<9&&(Math.abs(Math.floor(n/3)-Math.floor(i/3))+Math.abs(n%3-i%3)<=1));cells.forEach(j=>oneLightsBoard[j]=!oneLightsBoard[j])}
function startOneLights(){oneLightsLevel=0;renderOneLights()}
function renderOneLights(){oneLightsBoard=Array(9).fill(true);ONE_LIGHT_SCRIPTS[oneLightsLevel].forEach(i=>toggleOneLight(i));
 const dir='Some spotlights have gone dark. Tap the lights to change nearby lights. Turn all nine lights gold to light Arthur’s stage.';
 setScreen('onelights',missionShell('💡 Spotlight Switchboard',oneLightsLevel+1,5,
  `${instruct(dir)}<p class="game-copy">Light every bulb to get the stage ready!</p><div class="light-grid">${Array.from({length:9},(_,i)=>`<button class="light-bulb" data-light="${i}" aria-label="Spotlight ${i+1}">💡</button>`).join('')}</div><p class="game-note" id="lightStatus"></p><div style="text-align:center"><button class="secondary" id="lightHint">💡 Show me a hint</button></div>`));
 hookupBack();hookupSpeak(dir);drawOneLights();S.querySelectorAll('[data-light]').forEach(b=>b.onclick=()=>{
  toggleOneLight(Number(b.dataset.light));sound('tick');drawOneLights();if(oneLightsBoard.every(Boolean)){
   S.querySelectorAll('[data-light]').forEach(x=>x.disabled=true);sound('win');delay(()=>{oneLightsLevel++;if(oneLightsLevel<5){award(5,'Spotlights ready!');renderOneLights()}else finish('onelights','Light Engineer','💡',28)},800)
  }
 });
 document.getElementById('lightHint').onclick=()=>{
   let solution=null;for(let mask=1;mask<512;mask++){
    const b=oneLightsBoard.slice();for(let i=0;i<9;i++)if(mask&(1<<i)){for(const j of [i,i-3,i+3,i-1,i+1])if(j>=0&&j<9&&Math.abs(Math.floor(j/3)-Math.floor(i/3))+Math.abs(j%3-i%3)<=1)b[j]=!b[j]}
    if(b.every(Boolean)){solution=mask;break}
   }
   if(solution!==null){const ix=Array.from({length:9},(_,i)=>i).find(i=>solution&(1<<i));const btn=S.querySelector(`[data-light="${ix}"]`);btn?.classList.add('hinted');btn?.setAttribute('style','outline:5px solid #ff5479');delay(()=>btn?.removeAttribute('style'),1300);say('Try the glowing spotlight!')}
 }
}
function drawOneLights(){S.querySelectorAll('[data-light]').forEach(b=>{const lit=oneLightsBoard[Number(b.dataset.light)];b.classList.toggle('on',lit);b.textContent=lit?'💡':'◌'});const st=document.getElementById('lightStatus');if(st)st.textContent=`✨ ${oneLightsBoard.filter(Boolean).length} of 9 spotlights glowing`}
const ONE_CUE_ICONS=['💡','🎭','🥁','🦃'];
let oneCuesLevel=0,oneCuesStep=0,oneCuesSeq=[],oneCuesInput=0,oneCuesStatus='idle';
function startOneCues(){oneCuesLevel=0;oneCuesStep=0;renderOneCues()}
function renderOneCues(){const size=Math.min(6,3+Math.floor((oneCuesLevel+oneCuesStep)/2));oneCuesSeq=Array.from({length:size},(_,i)=>(oneCuesLevel*2+oneCuesStep+i*3+i*i)%4);oneCuesInput=0;oneCuesStatus='ready';
 const dir='Watch the director’s stage cues. Then tap them in the same order. Lights, curtain, drum, and turkey!';
 setScreen('onecues',missionShell('🎛️ Director’s Cue Challenge',oneCuesLevel+1,4,
  `${instruct(dir)}<p class="game-copy">Control the whole Thanksgiving performance!</p><div class="cue-status" id="cueStatus">Round ${oneCuesStep+1} of 3. Ready?</div><div class="cue-board">${ONE_CUE_ICONS.map((em,i)=>`<button class="cue-button" data-cue="${i}" aria-label="${['Lights','Curtain','Music','Turkey costume'][i]}" disabled>${em}</button>`).join('')}</div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="primary" id="cueWatch">▶ Watch Stage Cues</button><button class="secondary" id="cueRepeat" disabled>🔁 Watch Again</button></div><div class="progress-track"><div class="progress-fill" id="cueFill"></div></div>`));
 hookupBack();hookupSpeak(dir);document.getElementById('cueWatch').onclick=showOneCues;document.getElementById('cueRepeat').onclick=showOneCues;
 S.querySelectorAll('[data-cue]').forEach(b=>b.onclick=()=>tapOneCue(Number(b.dataset.cue)))
}
function showOneCues(){if(oneCuesStatus==='watching')return;oneCuesStatus='watching';
 S.querySelectorAll('[data-cue]').forEach(b=>b.disabled=true);document.getElementById('cueWatch').disabled=true;document.getElementById('cueRepeat').disabled=true;document.getElementById('cueStatus').textContent='Watch Arthur’s stage directions! 👀';
 oneCuesSeq.forEach((cue,i)=>delay(()=>{
  const b=S.querySelector(`[data-cue="${cue}"]`);if(!b)return;b.classList.add('lit');sound('drum');delay(()=>b.classList.remove('lit'),410)
 },450+i*770));
 delay(()=>{oneCuesStatus='input';oneCuesInput=0;document.getElementById('cueStatus').textContent='Your turn — run the show!';S.querySelectorAll('[data-cue]').forEach(b=>b.disabled=false);document.getElementById('cueRepeat').disabled=false},oneCuesSeq.length*770+540)
}
function tapOneCue(ix){if(oneCuesStatus!=='input')return;
 const b=S.querySelector(`[data-cue="${ix}"]`);b?.classList.add('lit');delay(()=>b?.classList.remove('lit'),240);
 if(ix!==oneCuesSeq[oneCuesInput]){oneCuesStatus='ready';sound('no');document.getElementById('cueStatus').textContent='Oops! Watch the stage cues again!';S.querySelectorAll('[data-cue]').forEach(x=>x.disabled=true);document.getElementById('cueWatch').disabled=false;document.getElementById('cueRepeat').disabled=false;document.getElementById('cueFill').style.width='0%';return}
 sound('good');oneCuesInput++;document.getElementById('cueFill').style.width=(oneCuesInput/oneCuesSeq.length*100)+'%';
 if(oneCuesInput===oneCuesSeq.length){oneCuesStatus='complete';S.querySelectorAll('[data-cue]').forEach(x=>x.disabled=true);document.getElementById('cueStatus').textContent='Perfect stage directions! ⭐';delay(()=>{
 oneCuesStep++;if(oneCuesStep===3){oneCuesStep=0;oneCuesLevel++}if(oneCuesLevel<4){award(3,'Stage cue complete!');renderOneCues()}else finish('onecues','Showtime Director','🎛️',28)
 },700)}
}

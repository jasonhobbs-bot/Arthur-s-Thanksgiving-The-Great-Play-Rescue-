  function home(){state.page='home';setTimersClear();page(`<section class="hero"><div><div class="eyebrow">🎟️ A book-inspired classroom adventure</div><h1 class="headline">The Great <span>Play Rescue!</span></h1><p class="intro">Arthur is directing the Thanksgiving school play, but there's a big problem: <strong>nobody wants to be the turkey!</strong> Help Gilly save the show with six amazing mini-games.</p><button class="btn btn-primary" data-action="chooseMode">🎬 START THE ADVENTURE <span aria-hidden="true">→</span></button><div class="hero-badges"><span>🖐️ Built for iPad</span><span>🎮 6 games</span><span>🎒 Pre-K–5</span><span>⭐ Earn stars</span></div></div><div class="hero-art">${theaterSvg()}</div></section><div class="book-hint"><strong>📖 Read the book first:</strong> Discuss why nobody wants to play the turkey. Then let the class discover how kindness, imagination, and teamwork can save the show.</div><div class="splash-footer"><span>✨ Original visuals, sound effects, and touch controls</span><span>🔐 Progress stays on this device</span></div>`)}
  function modeSelect(){state.page='modes';setTimersClear();page(`<section class="title-section"><div class="eyebrow">Choose your adventure</div><h1>Who's joining the play? 🎭</h1><p>Each mode changes the number of choices, memory patterns, and arcade challenge. Pick the grade level that fits your class.</p></section><div class="mode-grid"><button class="mode-card" data-action="setMode" data-mode="little"><div class="mode-icon">🐣</div><h2>Little Players</h2><p>Big pictures, short patterns, simple choices, and a gentle pace.</p><b>PRE-K & KINDERGARTEN</b></button><button class="mode-card" data-action="setMode" data-mode="stars"><div class="mode-icon">🌟</div><h2>Rising Stars</h2><p>Color challenges, surprising story questions, and fun game speed.</p><b>GRADES 1–2</b></button><button class="mode-card" data-action="setMode" data-mode="directors"><div class="mode-icon">🏆</div><h2>Star Directors</h2><p>Tougher patterns, trickier questions, and faster arcade action.</p><b>GRADES 3–5</b></button></div><div class="back-row"><button class="btn btn-ghost" data-action="home">← Back</button></div>`)}
  function hub(){state.page='hub';setTimersClear();let n=state.done.length;page(`<section class="title-section"><div class="eyebrow">${modeNames[state.mode]}</div><h1>Choose your next mission!</h1><p>Complete six adventures, collect stars, and save the school Thanksgiving show.</p><div class="progress-outer" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="6" aria-label="Completed missions"><div class="progress-inner" style="width:${n/6*100}%"></div></div></section><div class="act-grid">${chapters.map((c,i)=>`<button class="act-card ${state.done.includes(c.id)?'done':''}" data-action="open" data-id="${c.id}"><div class="act-icon">${c.icon}</div><h3>Act ${i+1}: ${c.name}</h3><p>${c.desc}</p><div class="act-small"><span>⏱️ ${c.time}</span><span class="go">${state.done.includes(c.id)?'✅ Replay':'▶ Play'}</span></div></button>`).join('')}</div>${n===6?`<div style="text-align:center"><button class="btn btn-primary" data-action="theEnd">🏆 OPEN THE GRAND FINALE</button></div>`:''}<div class="back-row"><button class="btn btn-ghost" data-action="chooseMode">← Change difficulty</button></div>`)}
  function missionWrap(chapterId,body,roundTitle=''){const idx=chapters.findIndex(c=>c.id===chapterId);let c=chapters[idx];page(`<div class="mission-line"><div><div class="eyebrow">ACT ${idx+1} OF 6 • ${enc(modeNames[state.mode])}</div><h1>${c.icon} ${c.name}</h1><p>${c.desc}</p></div><button class="btn btn-ghost" data-action="hub">↩ Mission map</button></div><div class="progress-outer"><div class="progress-inner" style="width:${((idx+(state.done.includes(c.id)?1:0))/6)*100}%"></div></div><section class="game-panel">${body}</section>`) }
  function markDone(id){setTimersClear();if(!state.done.includes(id)){state.done.push(id);state.stars+=3;sfx('yay');save();confetti()}else sfx('yay');state.page='won';state.chapter=id;won()}
  function won(){const c=chapters.find(x=>x.id===state.chapter);const all=state.done.length===6;missionWrap(c.id,`<div class="completion"><div class="medal">🏅</div><div class="eyebrow" style="color:#7654a3">MISSION COMPLETE!</div><h2>${c.name} — Bravo!</h2><div class="big-stars" aria-label="three stars">⭐ ⭐ ⭐</div><p>You've helped Arthur's play become even more wonderful. ${all?'Every act is finished. The stage is yours!':'Another step toward the big Thanksgiving performance!'}</p><div class="next-actions"><button class="btn btn-primary" data-action="${all?'theEnd':'hub'}">${all?'🎭 Grand finale!':'🚀 Next mission!'}</button><button class="btn btn-secondary" data-action="open" data-id="${c.id}">🔄 Play again</button></div></div>`)}
  function backHub(){hub()}
  const castingQuestions=[
    {face:'🐻',who:'Bear',say:'"I feel shy in a turkey costume."',q:'What should a kind director say?',answers:['"Want to practice together?"','"You have to do it!"','"Then go away!"'],correct:0,why:'A great director helps everyone feel brave.'},
    {face:'🦊',who:'Fox',say:'"I am worried the audience will laugh."',q:'What can you say to help?',answers:['"I will laugh too."','"You can choose a part you like."','"You are being silly."'],correct:1,why:'Letting friends choose helps them feel respected.'},
    {face:'🐰',who:'Bunny',say:'"I want to help, but not on stage."',q:'What is another way to help?',answers:['"Everyone must act."','"You cannot help."','"Can you make our props?"'],correct:2,why:'Every show needs behind-the-scenes helpers.'},
    {face:'🐭',who:'Mouse',say:'"The turkey costume looks boring."',q:'How can the class make it better?',answers:['"Design bright feathers together!"','"Cancel the whole show!"','"Throw the costume away!"'],correct:0,why:'Creativity works best when everyone joins in.'},

    {face:'🐸',who:'Frog',say:'"I made a mistake during practice."',q:'How should the director respond?',answers:['"You ruined everything!"','"Give up."','"Mistakes help us learn. Try again!"'],correct:2,why:'Encouragement helps a team improve.'}
  ];
  function casting(){state.page='casting';const questions=state.mode==='little'?castingQuestions.slice(0,4):castingQuestions;const q=questions[state.round];if(!q){markDone('casting');return}const visible=state.mode==='little'?2:3;const options=state.mode==='little'?[q.answers[q.correct],q.answers[(q.correct+1)%3]]:q.answers;const correctAt=state.mode==='little'?0:q.correct;missionWrap('casting',`<div class="game-heading"><h2>🎤 Cast the show</h2><span class="round">Friend ${state.round+1} of ${questions.length}</span></div><div class="story-scene"><span class="actor-face" aria-hidden="true">${q.face}</span><div class="speech"><div style="color:#71539b;font-size:15px">${q.who} says:</div>${enc(q.say)}</div></div><p class="game-instruction">${enc(q.q)}</p><button type="button" class="btn btn-secondary" style="min-height:44px;font-size:15px;box-shadow:none;margin-bottom:15px" data-action="readCast">🔈 Read to me</button><div class="answer-grid" style="grid-template-columns:repeat(${visible},minmax(0,1fr))">${options.map((t,i)=>`<button class="answer" data-action="castAnswer" data-choice="${i}" ${state.feedback?'disabled':''}>${enc(t)}</button>`).join('')}</div>${state.feedback?`<div class="feedback ${state.feedback.good?'good':'try'}">${state.feedback.good?'✅':'💛'} ${enc(state.feedback.msg)}</div><div class="game-actions"><span class="tiny">Teamwork makes a great play!</span><button class="btn btn-primary" data-action="castNext">${state.feedback.good?'Continue →':'Try again ↻'}</button></div>`:''}`)}
  function castAnswer(i){let q=castingQuestions[state.round];let right=state.mode==='little'?i===0:i===q.correct;sfx(right?'yay':'no');state.feedback={good:right,msg:right?q.why:'That might hurt a friend’s feelings. Try a kinder choice.'};casting()}
  function castNext(){if(state.feedback?.good){state.round++}state.feedback=null;casting()}
  const patterns=[ [0,1,2,3,4],[0,1,0,1,0],[4,2,1,2,4],[0,3,2,1,4],[5,0,3,1,2] ];
  function featherSVG(selected){const cx=210,cy=195,rots=[-64,-34,0,34,64];return `<svg class="svg-turkey" viewBox="0 0 420 370" role="img" aria-label="Turkey costume with ${selected.length} colored feathers"><ellipse cx="210" cy="342" rx="132" ry="14" fill="#af82934f"/>${rots.map((r,i)=>`<ellipse cx="${cx}" cy="${cy-79}" rx="43" ry="105" fill="${selected[i]==null?'#ffffff':colors[selected[i]].c}" stroke="#ac798d" stroke-width="5" transform="rotate(${r} ${cx} ${cy})"/><path d="M${cx} ${cy-169} Q${cx+4} ${cy-111} ${cx} ${cy-43}" transform="rotate(${r} ${cx} ${cy})" fill="none" stroke="#ffffff85" stroke-width="5" stroke-linecap="round"/>`).join('')}<ellipse cx="210" cy="258" rx="94" ry="94" fill="#ad705f" stroke="#82546a" stroke-width="7"/><ellipse cx="210" cy="177" rx="65" ry="68" fill="#f4c58f" stroke="#a7787e" stroke-width="7"/><circle cx="186" cy="165" r="10" fill="#493550"/><circle cx="235" cy="165" r="10" fill="#493550"/><path d="M209 176l19 15-19 19-20-19Z" fill="#ef924f"/><path d="M183 230Q206 248 233 230" stroke="#875567" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="210" cy="272" rx="53" ry="43" fill="#eed39b"/><path d="M150 328l-14 22m144-22 14 22" stroke="#e6a566" stroke-width="11" stroke-linecap="round"/></svg>`}
  function costume(){state.page='costume';const max=state.mode==='little'?3:state.mode==='stars'?4:5;let target=patterns[state.costumeRound];if(state.costumeRound>=max){markDone('costume');return}let makeFree=state.mode==='little' || state.costumeRound===0;missionWrap('costume',`<div class="game-heading"><h2>🎨 Feather Fashion</h2><span class="round">Costume ${state.costumeRound+1} of ${max}</span></div><p class="game-instruction">${makeFree?'Make an amazing turkey costume! Pick any five feather colors.':'Copy the color pattern in order. Look carefully, then tap five colors!'}</p>${!makeFree?`<div class="target-list"><b>Match these feathers: &nbsp;</b>${target.map(i=>`<span class="target-dot" aria-label="${colors[i].name}" style="background:${colors[i].c}"></span>`).join('')}</div>`:''}<div class="costume-workshop"><div class="costume-canvas">${featherSVG(state.costume)}</div><div><div class="costume-helper">🦃 ${state.costume.length}/5 feathers added. ${state.feedback?enc(state.feedback.msg):makeFree?'Tap your favorite colors!':'Follow the pattern from left to right.'}</div><div class="palette" style="margin-top:17px">${colors.map((c,i)=>`<button class="color-choice" style="background:#f8edff" data-action="feather" data-color="${i}" aria-label="Choose ${c.name}"><span class="color-dot" style="background:${c.c}"></span><span>${c.name}</span></button>`).join('')}</div><div class="game-actions"><button class="btn btn-secondary" data-action="undoFeather">↶ Undo</button><button class="btn btn-primary" data-action="costumeNext" ${state.costume.length<5?'disabled':''}>${state.costumeRound===max-1?'Finish!':'Next outfit →'}</button></div></div></div>`)}
  function feather(i){if(state.costume.length>=5)return;let free=state.mode==='little'||state.costumeRound===0;if(!free && patterns[state.costumeRound][state.costume.length]!==i){sfx('no');state.feedback={msg:'Almost! Try the next color shown in the pattern.'};costume();return}state.costume.push(i);state.feedback=null;sfx('pop');if(state.costume.length===5){sfx('yay');confetti();toast('🌈 Incredible costume!')}costume()}
  function costumeNext(){if(state.costume.length<5)return;state.costumeRound++;state.costume=[];state.feedback=null;costume()}
  const quiz=[
    {q:'What is Arthur trying to direct?',a:['A Thanksgiving school play','A race at the park','A space mission','A baseball game'],c:0,e:'Arthur is the director of a school Thanksgiving play.'},

  function detective(){state.page='detective';let total=state.mode==='little'?4:state.mode==='stars'?6:8;if(state.round>=total){markDone('detective');return}let q=quiz[state.round];let indices=state.mode==='little'?[q.c,(q.c+1)%4]:state.mode==='stars'?[q.c,(q.c+1)%4,(q.c+2)%4]:[0,1,2,3];missionWrap('detective',`<div class="game-heading"><h2>📚 Story Spotlight</h2><span class="round">Question ${state.round+1} of ${total}</span></div><div class="question-tag">🔍 Book connection + kindness</div><p class="game-instruction" style="font-size:clamp(23px,3vw,31px)">${enc(q.q)}</p><button type="button" class="btn btn-secondary" style="min-height:44px;font-size:15px;box-shadow:none;margin-bottom:15px" data-action="readQuiz">🔈 Read to me</button><div class="quiz-choices">${indices.map((j,i)=>`<button class="quiz-choice" data-action="quizAnswer" data-choice="${j}" ${state.feedback?'disabled':''}><span class="option-letter">${String.fromCharCode(65+i)}</span>${enc(q.a[j])}</button>`).join('')}</div>${state.feedback?`<div class="feedback ${state.feedback.good?'good':'try'}">${state.feedback.good?'🌟':'💡'} ${enc(state.feedback.msg)}</div><div class="game-actions"><span class="tiny">Think about the story and being a helpful friend.</span><button class="btn btn-primary" data-action="quizNext">${state.feedback.good?'Next question →':'Try again ↻'}</button></div>`:''}`)}

  function newRhythm(){let len=(state.mode==='little'?2:state.mode==='stars'?3:4)+Math.floor(state.round/2);state.rhythmPattern=Array.from({length:Math.min(len,7)},()=>Math.floor(Math.random()*3));state.rhythmInput=0;state.rhythmShowing=true;state.feedback=null}
  function rhythm(){state.page='rhythm';let total=state.mode==='little'?4:state.mode==='stars'?5:6;if(state.round>=total){markDone('rhythm');return}if(state.rhythmPattern.length===0)newRhythm();let controls=[['👏','CLAP'],['👣','STOMP'],['🦃','GOBBLE']];missionWrap('rhythm',`<div class="game-heading"><h2>🎵 Copy the beat!</h2><span class="round">Beat ${state.round+1} of ${total}</span></div><p class="game-instruction">Watch the show’s rehearsal pattern. Then tap the instruments in the <strong>same order</strong>.</p><div id="rhythmBoard" class="rhythm-board">${state.rhythmPattern.map((n,i)=>`<div class="beat-bubble" data-seq="${i}" aria-label="Beat ${i+1}">${state.rhythmShowing?'✨':'?'}</div>`).join('')}</div><div class="step-pips">${state.rhythmPattern.map((_,i)=>`<span class="${i<state.rhythmInput?'on':i===state.rhythmInput?'current':''}"></span>`).join('')}</div><div class="rhythm-controls">${controls.map(([ico,lab],i)=>`<button class="rhythm-key" data-action="rhythmTap" data-beat="${i}" ${state.rhythmShowing||state.feedback?'disabled':''}>${ico}<span>${lab}</span></button>`).join('')}</div>${state.feedback?`<div class="feedback ${state.feedback.good?'good':'try'}">${state.feedback.good?'🎉':'💛'} ${enc(state.feedback.msg)}</div><div class="game-actions"><span class="tiny">You can watch the pattern again any time.</span><button class="btn btn-primary" data-action="rhythmContinue">${state.feedback.good?'Next rhythm →':'Watch again ↻'}</button></div>`:`<div class="game-actions"><span class="tiny" id="rhythmStatus">${state.rhythmShowing?'👀 Watch the flashing beats…':'Your turn! Match the pattern.'}</span><button class="btn btn-secondary" data-action="rhythmReplay">↻ Replay beat</button></div>`}`);if(state.rhythmShowing&&!state.feedback)rhythmDemo()}
  function rhythmDemo(){const bubbles=[...document.querySelectorAll('.beat-bubble')];const pattern=state.rhythmPattern.slice();const icons=['👏','👣','🦃'];bubbles.forEach(x=>x.textContent='?');pattern.forEach((v,i)=>{schedule(()=>{if(state.page!=='rhythm'||!state.rhythmShowing)return;bubbles.forEach(x=>x.classList.remove('active'));bubbles[i]?.classList.add('active');if(bubbles[i])bubbles[i].textContent=icons[v];sfx('beat')},650+i*700)});schedule(()=>{if(state.page!=='rhythm')return;state.rhythmShowing=false;bubbles.forEach(x=>x.classList.remove('active'));document.querySelectorAll('.rhythm-key').forEach(x=>x.disabled=false);let t=document.getElementById('rhythmStatus');if(t)t.textContent='🎤 Your turn! Copy the sequence.'},850+pattern.length*700)}
  function rhythmTap(n){if(state.rhythmShowing||state.feedback)return;let correct=state.rhythmPattern[state.rhythmInput]===n;if(!correct){state.feedback={good:false,msg:'Oops! That is a different beat. Watch the pattern again.'};sfx('no');rhythm();return}state.rhythmInput++;sfx('beat');if(state.rhythmInput===state.rhythmPattern.length){state.feedback={good:true,msg:'Perfect timing! Your actors are ready!'};sfx('yay');rhythm();return}const t=document.querySelectorAll('.step-pips span');t.forEach((x,i)=>x.className=i<state.rhythmInput?'on':i===state.rhythmInput?'current':'');toast('Nice beat! '+state.rhythmInput+'/'+state.rhythmPattern.length)}
  function rhythmReplay(){setTimersClear();state.rhythmShowing=true;state.rhythmInput=0;state.feedback=null;rhythm()}
  function rhythmContinue(){if(state.feedback?.good){state.round++;state.rhythmPattern=[]}else{state.rhythmInput=0;state.rhythmShowing=true}state.feedback=null;rhythm()}
  const props=[{id:'pumpkin',icon:'🎃',name:'Pumpkin'},{id:'corn',icon:'🌽',name:'Corn'},{id:'leaves',icon:'🍁',name:'Leaves'},{id:'star',icon:'⭐',name:'Star'},{id:'flowers',icon:'🌻',name:'Flowers'},{id:'acorn',icon:'🌰',name:'Acorn'}];
  function finale(){state.page='finale';let filled=state.stageProps.filter(Boolean).length;missionWrap('finale',`<div class="game-heading"><h2>🏟️ Set the stage</h2><span class="round">${filled} of 5 decorations</span></div><p class="game-instruction">Choose a prop, then tap an empty spot on the stage. Create your own Thanksgiving scene! When all five spots are filled, raise the curtain.</p><div class="stage-stage" aria-label="Theater stage with original cartoon actors"><div class="big-actor">🐊</div><div class="big-actor">🦃</div><div class="big-actor">🐰</div></div><div class="decor-stage" aria-label="Five decoration spots">${Array.from({length:5},(_,i)=>{let obj=props.find(p=>p.id===state.stageProps[i]);return `<button class="decor-slot" data-action="placeProp" data-position="${i}" aria-label="Stage decoration ${i+1}: ${obj?obj.name:'empty'}">${obj?obj.icon:'＋'}</button>`}).join('')}</div><div class="prop-palette">${props.map(p=>`<button class="prop-pick ${state.chosenProp===p.id?'active':''} ${state.stageProps.includes(p.id)?'used':''}" data-action="chooseProp" data-prop="${p.id}" ${state.stageProps.includes(p.id)?'disabled':''}>${p.icon}<span>${p.name}</span></button>`).join('')}</div><div class="game-actions"><span class="tiny">${state.chosenProp?'✅ Great! Tap a stage spot now.':'👆 Tap a prop to pick it up.'}</span><button class="btn btn-primary" data-action="finishFinale" ${filled<5?'disabled':''}>🎬 RAISE THE CURTAIN!</button></div>`)}
  function chooseProp(id){if(state.stageProps.includes(id))return;state.chosenProp=id;sfx('pop');finale()}
  function placeProp(n){if(!state.chosenProp){toast('First choose a decoration below!');return}state.stageProps[n]=state.chosenProp;state.chosenProp=null;sfx('pop');finale()}
  function finishFinale(){if(state.stageProps.filter(Boolean).length<5)return;markDone('finale')}
  function theEnd(){state.page='end';setTimersClear();sfx('yay');confetti();page(`<section class="title-section"><div class="eyebrow">🌟 The curtain is up! 🌟</div><h1>You saved the Thanksgiving play!</h1><p>Arthur's show is ready because you made kind choices, solved problems, and helped your team shine.</p></section><div class="end-stage"><div class="actors">🐊 🦃 🐰</div><div class="audience" style="text-align:center">👏👏👏👏👏</div></div><div class="game-panel"><div class="certificate"><div class="certstar">🏆</div><div class="certtitle">OFFICIAL PLAY RESCUE HERO!</div><p>You earned <strong>${state.stars} stars</strong> and helped every actor feel welcome.</p><p style="font-weight:900">Creative • Kind • A Great Teammate</p><div style="font-size:34px">🎭 🦃 🌟</div></div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" data-action="print">🖨️ Print award</button><button class="btn btn-secondary" data-action="hub">🎮 Play more games</button><button class="btn btn-secondary" data-action="chooseMode">🎒 Try another level</button></div></div>`)}
  function startArcade(){state.page='props';const target=state.mode==='little'?12:state.mode==='stars'?16:21;let speed=state.mode==='little'?180:state.mode==='stars'?230:280;const totalSec=state.mode==='little'?70:state.mode==='stars'?77:85;missionWrap('props',`<div class="game-heading"><h2>🍁 Prop Dash!</h2><span class="round">Collect ${target} props!</span></div><p class="game-instruction">Move your Gator to catch <strong>🎃 🌽 🍁 ⭐</strong>. Dodge the silly surprises <strong>⚽ 🧦</strong>! Tap a lane or swipe on the stage.</p><div class="arcade-grid"><div class="arcade-wrapper"><canvas id="arcade" width="720" height="440" aria-label="Arcade game where decorations fall down three lanes"></canvas></div><div class="arcade-side"><div class="arcade-score">PROPS SAVED<strong id="arcadePoints">0 / ${target}</strong><div style="font-size:14px;margin-top:12px">TIME LEFT: <span id="arcadeTime">${totalSec}s</span></div></div><div><div class="lane-buttons" aria-label="Choose your lane"><button data-action="lane" data-lane="0" aria-label="Left lane">⬅️</button><button data-action="lane" data-lane="1" class="active" aria-label="Middle lane">⬆️</button><button data-action="lane" data-lane="2" aria-label="Right lane">➡️</button></div><p class="icon-note" style="text-align:center;margin-top:12px">Tap left, center, or right.</p></div></div></div><div class="game-actions"><span class="tiny">💛 Every prop helps the school play!</span><button class="btn btn-secondary" data-action="arcadeRestart">↻ Restart race</button></div>`);
  const canvas=document.getElementById('arcade'),ctx=canvas.getContext('2d');let game={ctx,canvas,lane:1,fall:[],score:0,target,time:totalSec,start:performance.now(),last:performance.now(),spawn:0,spawnEvery:state.mode==='little'?.7:state.mode==='stars'?.58:.49,speed,done:false};state.arcade=game;
  const swipe=x=>{let rect=canvas.getBoundingClientRect();let rel=(x-rect.left)/rect.width;setLane(rel<.34?0:rel<.67?1:2)};
  canvas.addEventListener('pointerdown',ev=>{if(state.arcade===game)swipe(ev.clientX)});
  function emoji(s,x,y,size){ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
  function frame(now){if(state.arcade!==game||game.done)return;let dt=Math.min((now-game.last)/1000,.05);game.last=now;let elapsed=(now-game.start)/1000;let left=Math.max(0,Math.ceil(totalSec-elapsed));let w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#d9efff');sky.addColorStop(1,'#fce1b6');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#fdf5cb';ctx.beginPath();ctx.arc(620,65,45,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bcb6e4';for(let i=0;i<4;i++){let x=(i*210+50)%w;ctx.beginPath();ctx.arc(x,130,55,Math.PI,0);ctx.arc(x+70,130,65,Math.PI,0);ctx.fill()}ctx.fillStyle='#bde1aa';ctx.beginPath();ctx.ellipse(200,420,350,150,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#98ca9f';ctx.beginPath();ctx.ellipse(580,426,330,140,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ac83b6';ctx.fillRect(45,0,5,400);ctx.fillRect(670,0,5,400);ctx.fillStyle='#ab679d';ctx.fillRect(0,389,w,51);ctx.fillStyle='#e3b482';ctx.fillRect(0,389,w,8);const centers=[140,360,580];for(let i=0;i<3;i++){ctx.strokeStyle='#ffffff88';ctx.lineWidth=5;ctx.setLineDash([11,11]);ctx.beginPath();ctx.moveTo(centers[i]-94,0);ctx.lineTo(centers[i]-94,388);ctx.stroke()}ctx.setLineDash([]);game.spawn+=dt;while(game.spawn>=game.spawnEvery){game.spawn-=game.spawnEvery;let lane=Math.floor(Math.random()*3),good=Math.random()<.78;game.fall.push({lane,y:-30,good,icon:good?['🎃','🌽','🍁','⭐'][Math.floor(Math.random()*4)]:['⚽','🧦'][Math.floor(Math.random()*2)],speed:game.speed*(.77+Math.random()*.42)})}
  for(let i=game.fall.length-1;i>=0;i--){let ob=game.fall[i];ob.y+=ob.speed*dt;emoji(ob.icon,centers[ob.lane],ob.y,52);if(ob.y>=351){if(ob.lane===game.lane){if(ob.good){game.score++;sfx('pop')}else{game.score=Math.max(0,game.score-1);sfx('no')}document.getElementById('arcadePoints').textContent=game.score+' / '+target;}game.fall.splice(i,1)}}
  ctx.fillStyle='#542e5e44';ctx.beginPath();ctx.ellipse(centers[game.lane],380,69,14,0,0,Math.PI*2);ctx.fill();emoji('🐊',centers[game.lane],335,78);document.getElementById('arcadeTime').textContent=left+'s';if(game.score>=target){game.done=true;markDone('props');return}if(left<=0){game.done=true;arcadeFail(game.score,target);return}tickHandle=requestAnimationFrame(frame)}tickHandle=requestAnimationFrame(frame)}
  function arcadeFail(score,target){setTimersClear();missionWrap('props',`<div class="completion"><div class="medal">🎃</div><h2>Almost saved the props!</h2><p>You collected <strong>${score} of ${target}</strong>. One more run and the show will be ready!</p><div class="next-actions"><button class="btn btn-primary" data-action="arcadeRestart">🏃 Race again!</button><button class="btn btn-secondary" data-action="hub">↩ Mission map</button></div></div>`)}
  function setLane(n){let game=state.arcade;if(!game||game.done)return;game.lane=Math.max(0,Math.min(2,n));document.querySelectorAll('[data-action="lane"]').forEach(el=>el.classList.toggle('active',Number(el.dataset.lane)===game.lane))}
  function startChapter(id){setTimersClear();state.chapter=id;state.round=0;state.feedback=null;state.costume=[];state.costumeRound=0;state.rhythmPattern=[];state.stageProps=[];state.chosenProp=null;switch(id){case'casting':casting();break;case'costume':costume();break;case'props':startArcade();break;case'rhythm':rhythm();break;case'detective':detective();break;case'finale':finale();break;default:hub()}}
  app.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;switch(a){case'home':home();break;case'chooseMode':modeSelect();break;case'setMode':state.mode=el.dataset.mode;save();sfx('pop');hub();break;case'hub':backHub();break;case'sound':state.sound=!state.sound;save();if(state.sound)sfx('pop');el.textContent=state.sound?'🔊':'🔇';el.title=`Sound ${state.sound?'on':'off'}`;el.setAttribute('aria-label',state.sound?'Mute sound':'Unmute sound');break;case'open':startChapter(el.dataset.id);break;case'castAnswer':castAnswer(Number(el.dataset.choice));break;case'castNext':castNext();break;case'feather':feather(Number(el.dataset.color));break;case'undoFeather':state.costume.pop();state.feedback=null;costume();break;case'costumeNext':costumeNext();break;case'quizAnswer':quizAnswer(Number(el.dataset.choice));break;case'quizNext':quizNext();break;case'readCast':{let q=castingQuestions[state.round];narrate(q.who+' says: '+q.say+' '+q.q+' '+(state.mode==='little'?[q.answers[q.correct],q.answers[(q.correct+1)%3]]:q.answers).join('. '));break}case'readQuiz':{let q=quiz[state.round];let ids=state.mode==='little'?[q.c,(q.c+1)%4]:state.mode==='stars'?[q.c,(q.c+1)%4,(q.c+2)%4]:[0,1,2,3];narrate(q.q+' '+ids.map(j=>q.a[j]).join('. '));break}case'rhythmTap':rhythmTap(Number(el.dataset.beat));break;case'rhythmReplay':rhythmReplay();break;case'rhythmContinue':rhythmContinue();break;case'lane':setLane(Number(el.dataset.lane));break;case'arcadeRestart':setTimersClear();startArcade();break;case'chooseProp':chooseProp(el.dataset.prop);break;case'placeProp':placeProp(Number(el.dataset.position));break;case'finishFinale':finishFinale();break;case'theEnd':theEnd();break;case'print':window.print();break;default:break}});
  window.addEventListener('keydown',ev=>{if(state.page==='props'&&state.arcade){if(ev.key==='ArrowLeft'){ev.preventDefault();setLane(Math.max(0,state.arcade.lane-1))}if(ev.key==='ArrowRight'){ev.preventDefault();setLane(Math.min(2,state.arcade.lane+1))}if(['1','2','3'].includes(ev.key))setLane(Number(ev.key)-1)}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.page==='props'){setTimersClear();toast('Race paused. Tap Restart race to play again.')}});
  if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  home();
})();
</script>
